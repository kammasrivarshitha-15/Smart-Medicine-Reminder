<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile - MedReminder</title>

    <link rel="stylesheet" href="css/profile.css">
</head>

<body>

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

        <div class="sidebar-logo">
            <span class="logo-icon">💊</span>
            <span>MedReminder</span>
        </div>

        <nav class="sidebar-nav">

            <a href="dashboard.html" class="nav-item">
                <span class="nav-icon">🏠</span>
                <span>Dashboard</span>
            </a>

            <a href="medicines.html" class="nav-item">
                <span class="nav-icon">💊</span>
                <span>My Medicines</span>
            </a>

            <a href="add-medicine.html" class="nav-item">
                <span class="nav-icon">➕</span>
                <span>Add Medicine</span>
            </a>

            <a href="history.html" class="nav-item">
                <span class="nav-icon">📋</span>
                <span>History</span>
            </a>

            <a href="profile.html" class="nav-item active">
                <span class="nav-icon">👤</span>
                <span>Profile</span>
            </a>

        </nav>

        <div class="sidebar-bottom">

            <a href="index.html" class="nav-item logout">
                <span class="nav-icon">🚪</span>
                <span>Logout</span>
            </a>

        </div>

    </aside>


    <!-- ================= MAIN CONTENT ================= -->

    <main class="main-content">

        <header class="page-header">

            <h1>My Profile</h1>

            <p>
                Manage your account information.
            </p>

        </header>


        <!-- ================= PROFILE CARD ================= -->

        <section class="profile-card">

            <div class="profile-top">

                <div class="profile-avatar" id="profileAvatar">
                    U
                </div>

                <div>

                    <h2 id="profileName">
                        User
                    </h2>

                    <p id="profileEmail">
                        user@example.com
                    </p>

                </div>

            </div>


            <!-- ================= PROFILE FORM ================= -->

            <form id="profileForm">

                <div class="form-row">

                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="Enter phone number"
                        >

                    </div>


                    <div class="form-group">

                        <label for="age">
                            Age
                        </label>

                        <input
                            type="number"
                            id="age"
                            placeholder="Enter your age"
                            min="1"
                            max="120"
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="address">
                        Address
                    </label>

                    <textarea
                        id="address"
                        rows="3"
                        placeholder="Enter your address"
                    ></textarea>

                </div>


                <div class="form-actions">

                    <button
                        type="button"
                        class="cancel-btn"
                        id="cancelBtn"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="save-btn"
                    >
                        Save Changes
                    </button>

                </div>

            </form>

        </section>


        <!-- ================= ACCOUNT SECTION ================= -->

        <section class="account-card">

            <h2>Account</h2>

            <p>
                Manage your account settings.
            </p>

            <button
                type="button"
                class="logout-btn"
                id="logoutBtn"
            >
                🚪 Logout
            </button>

        </section>

    </main>


    <script src="js/profile.js"></script>

</body>

</html>
